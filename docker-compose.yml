x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-steam}:${POSTGRES_PASSWORD:-steam}@db:5432/${POSTGRES_DB:-steam}
  ARTIFACTS_DIR: /app/artifacts
  DEFAULT_K: ${DEFAULT_K:-10}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-steam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-steam}
      POSTGRES_DB: ${POSTGRES_DB:-steam}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Roda uma vez a cada "up": migrações, dataset, seed e treino (só se não houver modelo).
  init:
    build: .
    environment:
      <<: *app-env
      FORCE_TRAIN: ${FORCE_TRAIN:-0}
      TRAIN_ARGS: ${TRAIN_ARGS:-}
      DATASET_URL: ${DATASET_URL:-}
    command: sh scripts/init.sh
    volumes:
      - data:/app/data
      - artifacts:/app/artifacts
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment: *app-env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - artifacts:/app/artifacts
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully

volumes:
  pgdata:
  data:
  artifacts:
