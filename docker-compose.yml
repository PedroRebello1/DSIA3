services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-steam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-steam}
      POSTGRES_DB: ${POSTGRES_DB:-steam}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-steam}:${POSTGRES_PASSWORD:-steam}@db:5432/${POSTGRES_DB:-steam}
      ARTIFACTS_DIR: /app/artifacts
      DEFAULT_K: ${DEFAULT_K:-10}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - data:/app/data
      - artifacts:/app/artifacts
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  data:
  artifacts:
