name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala o ruff
        run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"

      - name: Verifica estilo
        run: ruff check --output-format=github .

      - name: Verifica formatação
        run: ruff format --check .

  test:
    name: Testes (pytest + cobertura)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instala dependências
        run: pip install -r requirements-dev.txt

      - name: Roda os testes
        run: pytest --cov --cov-report=term --cov-report=xml

      - name: Publica o relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  smoke:
    name: Smoke test (docker compose)
    runs-on: ubuntu-latest
    needs: test
    env:
      # Treino mais rápido no CI: sem busca de hiperparâmetros e avaliação com amostra.
      TRAIN_ARGS: --no-search --eval-users 300
    steps:
      - uses: actions/checkout@v4

      - name: Sobe a stack (db, init com seed e treino, api)
        run: docker compose up -d --build

      - name: Smoke test
        run: sh scripts/smoke_test.sh

      - name: Logs dos containers
        if: failure()
        run: docker compose logs --no-color

      - name: Derruba a stack
        if: always()
        run: docker compose down -v
